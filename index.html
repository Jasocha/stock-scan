<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ja.Socha Stock Scan</title>
<style>
/* Layout: sticky header (counter + scan toggle) over a scrollable running list, sticky footer submit bar */
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --fg:#201C18; --muted:#8A8178; --line:#E6DFD3;
  --accent:#1F3D2E; --accent-fg:#FFFFFF; --accent-soft:#E7EEE9;
  --danger:#B3432B; --danger-soft:#F6E6E1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120F; --surface:#1E1A16; --fg:#F2ECE3; --muted:#A79C8C; --line:#332C24;
    --accent:#6FA98A; --accent-fg:#13241B; --accent-soft:#233B30;
    --danger:#E08567; --danger-soft:#3A241D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120F; --surface:#1E1A16; --fg:#F2ECE3; --muted:#A79C8C; --line:#332C24;
  --accent:#6FA98A; --accent-fg:#13241B; --accent-soft:#233B30;
  --danger:#E08567; --danger-soft:#3A241D;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.mono{ font-family:"SF Mono",SFMono-Regular,Consolas,"Roboto Mono",monospace; font-variant-numeric:tabular-nums; }
h1{ font-size:17px; font-weight:700; letter-spacing:.01em; margin:0; }
.eyebrow{ font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  background:var(--bg); padding-top:14px; padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
body::before{
  content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
  z-index:10; background:var(--bg);
}
.top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.counter-select{
  flex:1; min-width:0; appearance:none; -webkit-appearance:none;
  background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%238A8178" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
  border:1px solid var(--line); border-radius:10px; color:var(--fg);
  font:inherit; font-weight:600; padding:12px 36px 12px 14px;
}
#camStatus{ font-size:12px; color:var(--muted); }
#camStatus.live{ color:var(--accent); font-weight:600; }

.mode-toggle{
  display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px;
}
.mode-toggle button{
  flex:1; border:none; background:var(--surface); color:var(--muted); font:inherit; font-weight:700; font-size:13px;
  padding:10px 8px; cursor:pointer;
}
.mode-toggle button.active{ background:var(--accent); color:var(--accent-fg); }
.mode-toggle button[data-mode="stockin"].active{ background:#3A5FA0; color:#fff; }

.scan-btn{
  width:100%; border:none; border-radius:12px; padding:15px 16px;
  background:var(--accent); color:var(--accent-fg); font:inherit; font-weight:700; font-size:16px;
  display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
}
.scan-btn.stop{ background:var(--danger); }
.scan-btn svg{ width:20px; height:20px; flex:none; }

#readerWrap{ margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#000; display:none; position:relative; }
#readerWrap.active{ display:block; }
#reader{ display:block; width:100%; }
.scan-frame{
  position:absolute; inset:14%; border:2px solid var(--accent-fg); border-radius:14px;
  box-shadow:0 0 0 999px rgba(0,0,0,.28); pointer-events:none;
}
.flash{ position:absolute; inset:0; background:var(--accent); opacity:0; pointer-events:none; transition:opacity .08s ease; }
.flash.on{ opacity:.55; }

main{ flex:1; padding-top:14px; padding-bottom:160px; }
.list-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
.list-head .count{ color:var(--muted); font-size:13px; }

.empty{
  border:1px dashed var(--line); border-radius:12px; padding:28px 16px; text-align:center;
  color:var(--muted); font-size:13px; line-height:1.6;
}
.empty b{ display:block; color:var(--fg); font-size:14px; margin-bottom:4px; }

.item-row{
  display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);
}
.item-row:last-child{ border-bottom:none; }
.item-info{ flex:1; min-width:0; }
.item-name{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-sub{ font-size:12px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-sub .barcode{ font-size:11px; }
.unknown-tag{ display:inline-block; background:var(--danger-soft); color:var(--danger); font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:5px; padding:2px 5px; margin-left:6px; }

.qty-stepper{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:none; }
.qty-stepper button{
  width:30px; height:30px; border:none; background:var(--surface); color:var(--fg); font-size:17px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.qty-stepper button:active{ background:var(--accent-soft); }
.qty-val{ width:28px; text-align:center; font-weight:700; font-size:14px; }

.remove-btn{
  flex:none; width:30px; height:30px; border:none; background:transparent; color:var(--muted);
  display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:8px;
}
.remove-btn:active{ background:var(--danger-soft); color:var(--danger); }

.manual-add{ margin-top:16px; }
.manual-add summary{ font-size:12px; color:var(--muted); cursor:pointer; list-style:none; }
.manual-add summary::-webkit-details-marker{ display:none; }
.manual-add summary::before{ content:"+ "; color:var(--accent); font-weight:700; }
.manual-row{ display:flex; gap:8px; margin-top:10px; }
.manual-row input{
  flex:1; min-width:0; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--fg);
  font:inherit; padding:10px 12px;
}
.manual-row button{
  flex:none; border:none; border-radius:9px; background:var(--accent-soft); color:var(--accent); font:inherit; font-weight:700;
  padding:0 16px; cursor:pointer;
}

footer{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  padding:12px max(16px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  background:linear-gradient(to top, var(--bg) 60%, transparent);
}
.footer-card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  display:flex; align-items:center; gap:12px; box-shadow:0 6px 24px rgba(0,0,0,.12);
}
.footer-totals{ flex:1; min-width:0; }
.footer-totals .n{ font-size:18px; font-weight:800; }
.footer-totals .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.submit-btn{
  flex:none; border:none; border-radius:10px; padding:12px 20px; background:var(--accent); color:var(--accent-fg);
  font:inherit; font-weight:700; font-size:14px; cursor:pointer;
}
.submit-btn:disabled{ opacity:.45; }

.toast{
  position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 10px); transform:translate(-50%,-140%);
  background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600;
  z-index:20; transition:transform .25s ease; max-width:calc(100% - 32px); text-align:center;
}
.toast.show{ transform:translate(-50%,0); }
.toast.err{ background:var(--danger); color:#fff; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div>
      <div class="eyebrow">Ja.Socha</div>
      <h1>Stock-Out Scan</h1>
    </div>
    <span id="camStatus">Camera off</span>
  </div>
  <select id="counterSelect" class="counter-select" aria-label="Counter">
    <option value="" disabled selected>Select counter…</option>
    <option>Scotts</option>
    <option>Takashimaya</option>
    <option>OG PP</option>
    <option>OG AB</option>
    <option>KLCC</option>
    <option>TRX</option>
    <option>Midvalley</option>
  </select>
  <div class="mode-toggle" style="margin-top:12px;" role="group" aria-label="Mode">
    <button type="button" id="modeSellBtn" data-mode="sell" class="active">Sell (scan out)</button>
    <button type="button" id="modeStockinBtn" data-mode="stockin">Add Stock (stock count)</button>
  </div>
  <div id="readerWrap">
    <video id="reader" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div style="margin-top:12px;">
    <button class="scan-btn" id="scanToggle" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M21 7V5a2 2 0 0 0-2-2h-2M3 17v2a2 2 0 0 0 2 2h2M21 17v2a2 2 0 0 1-2 2h-2M7 12h10"/></svg>
      <span id="scanToggleLabel">Select a counter to start</span>
    </button>
  </div>
</header>

<main>
  <div class="list-head">
    <strong style="font-size:14px;">Scanned items</strong>
    <span class="count" id="listCount">0 lines</span>
  </div>
  <div id="list"></div>
  <div class="empty" id="emptyState">
    <b>Nothing scanned yet</b>
    <span id="emptyHint">Point the camera at a tag barcode — each scan adds a line below.<br>Sell 20 pieces? Scan all 20, then submit once.</span>
  </div>

  <details class="manual-add">
    <summary>Enter a barcode manually</summary>
    <div class="manual-row">
      <input type="text" id="manualInput" placeholder="e.g. JS-0819-50065-S" autocapitalize="characters" autocomplete="off">
      <button type="button" id="manualAddBtn">Add</button>
    </div>
  </details>
</main>

<footer>
  <div class="footer-card">
    <div class="footer-totals">
      <div class="n mono" id="totalQty">0</div>
      <div class="l">pieces to submit</div>
    </div>
    <button class="submit-btn" id="submitBtn" disabled>Submit all</button>
  </div>
</footer>

<div class="toast" id="toast"></div>

    total += it.qty;
    var row = document.createElement('div');
    row.className = 'item-row';
    var sub = it.unknown
      ? '<span class="barcode mono">' + it.barcode + '</span><span class="unknown-tag">Not in catalogue</span>'
      : (it.colour + ' · ' + it.size + ' · <span class="barcode mono">' + it.barcode + '</span>');
    row.innerHTML =
      '<div class="item-info">' +
        '<div class="item-name">' + (it.unknown ? it.barcode : it.style) + '</div>' +
        '<div class="item-sub">' + sub + '</div>' +
      '</div>' +
      '<div class="qty-stepper">' +
        '<button type="button" data-act="minus" data-idx="' + idx + '" aria-label="Decrease">−</button>' +
        '<span class="qty-val mono">' + it.qty + '</span>' +
        '<button type="button" data-act="plus" data-idx="' + idx + '" aria-label="Increase">+</button>' +
      '</div>' +
      '<button type="button" class="remove-btn" data-act="remove" data-idx="' + idx + '" aria-label="Remove">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>';
    listEl.appendChild(row);
  });
  listCount.textContent = scanned.length + (scanned.length === 1 ? ' line' : ' lines');
  totalQty.textContent = total;
  submitBtn.disabled = scanned.length === 0 || submitting;
}

listEl.addEventListener('click', function(e){
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var idx = parseInt(btn.getAttribute('data-idx'), 10);
  var act = btn.getAttribute('data-act');
  if (act === 'plus') scanned[idx].qty++;
  else if (act === 'minus') { scanned[idx].qty--; if (scanned[idx].qty <= 0) scanned.splice(idx, 1); }
  else if (act === 'remove') scanned.splice(idx, 1);
  render();
});

function addScan(barcode){
  barcode = (barcode || '').trim();
  if (!barcode) return;
  var meta = ITEMS[barcode];
  var existing = scanned.find(function(s){ return s.barcode === barcode; });
  if (existing){
    existing.qty++;
  } else if (meta){
    scanned.push({ barcode: barcode, style: meta[0], colour: meta[1], size: meta[2], qty: 1, unknown: false });
  } else {
    scanned.push({ barcode: barcode, style: '', colour: '', size: '', qty: 1, unknown: true });
  }
  render();
  beep();
  flash();
  var added = ITEMS[barcode] ? ITEMS[barcode][0] : barcode;
  showToast('Added: ' + added);
}

manualAddBtn.addEventListener('click', function(){
  if (manualInput.value.trim()){ addScan(manualInput.value); manualInput.value = ''; }
});
manualInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); manualAddBtn.click(); }
});

function onDecoded(decodedText){
  var now = Date.now();
  if (decodedText === lastCode && (now - lastCodeAt) < 1500) return;
  lastCode = decodedText; lastCodeAt = now;
  addScan(decodedText);
}

function startScanning(){
  if (!counterSelect.value){ showToast('Choose a counter first', true); return; }
  readerWrap.classList.add('active');
  camStatus.textContent = 'Starting camera…';
  codeReader = new ZXing.BrowserMultiFormatReader(null, 300);
  var decodeCb = function(result){
    if (result) onDecoded(result.getText());
    /* decode errors fire on every frame with no match found: ignore */
  };
  codeReader.decodeFromConstraints(
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, focusMode: { ideal: 'continuous' } } },
    'reader',
    decodeCb
  ).catch(function(){
    /* high-res / focusMode request not supported on this device: retry with a plain constraint */
    return codeReader.decodeFromConstraints(
      { video: { facingMode: 'environment' } },
      'reader',
      decodeCb
    );
  }).then(function(){
    scanning = true;
    camStatus.textContent = 'Camera live';
    camStatus.classList.add('live');
    scanToggle.classList.add('stop');
    scanToggleLabel.textContent = 'Stop scanning';
  }).catch(function(err){
    readerWrap.classList.remove('active');
    camStatus.textContent = 'Camera off';
    showToast('Could not open camera — check camera permission for this page', true);
  });
}

function stopScanning(){
  if (codeReader){
    try{ codeReader.reset(); }catch(e){}
    codeReader = null;
  }
  scanning = false;
  readerWrap.classList.remove('active');
  camStatus.textContent = 'Camera off';
  camStatus.classList.remove('live');
  scanToggle.classList.remove('stop');
  scanToggleLabel.textContent = 'Start scanning';
}

scanToggle.addEventListener('click', function(){
  if (scanning) stopScanning(); else startScanning();
});

counterSelect.addEventListener('change', function(){
  scanToggle.disabled = !counterSelect.value;
  if (!scanning) scanToggleLabel.textContent = counterSelect.value ? 'Start scanning' : 'Select a counter to start';
});

function setMode(newMode){
  if (newMode === mode) return;
  if (scanned.length && !confirm('Switch mode? This clears your current unsaved list.')) return;
  mode = newMode;
  scanned = [];
  modeSellBtn.classList.toggle('active', mode === 'sell');
  modeStockinBtn.classList.toggle('active', mode === 'stockin');
  emptyHint.innerHTML = mode === 'stockin'
    ? 'Doing a stock count? Scan each item as you count it — each scan adds a line below.<br>This ADDS to stock, it does not replace it.'
    : 'Point the camera at a tag barcode — each scan adds a line below.<br>Sell 20 pieces? Scan all 20, then submit once.';
  submitBtn.textContent = mode === 'stockin' ? 'Add to stock' : 'Submit all';
  render();
}
modeSellBtn.addEventListener('click', function(){ setMode('sell'); });
modeStockinBtn.addEventListener('click', function(){ setMode('stockin'); });

submitBtn.addEventListener('click', function(){
  if (!scanned.length || submitting) return;
  if (!counterSelect.value){ showToast('Choose a counter first', true); return; }
  submitting = true;
  submitBtn.disabled = true;
  var busyLabel = mode === 'stockin' ? 'Adding…' : 'Submitting…';
  var idleLabel = mode === 'stockin' ? 'Add to stock' : 'Submit all';
  submitBtn.textContent = busyLabel;
  var payload = {
    counter: counterSelect.value,
    mode: mode,
    items: scanned.map(function(s){ return { barcode: s.barcode, qty: s.qty }; })
  };
  fetch(SUBMIT_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      submitting = false;
      submitBtn.textContent = idleLabel;
      if (res && res.success){
        var total = payload.items.reduce(function(a,b){return a+b.qty;},0);
        showToast((mode === 'stockin' ? 'Added ' : 'Submitted ') + total + ' pieces ' + (mode === 'stockin' ? 'to stock at ' : 'to ') + payload.counter);
        scanned = [];
        render();
      } else {
        showToast((res && res.error) || 'Submit failed — try again', true);
        render();
      }
    })
    .catch(function(){
      submitting = false;
      submitBtn.textContent = idleLabel;
      showToast('No connection — try again', true);
      render();
    });
});

render();
</script>
</body>
</html>
